name: dormos
description: Offline dorm collaboration with optional GitHub sync.
publish_to: none
version: 0.6.0+6
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.0
  cryptography: ^2.9.0
  file_selector: 1.1.0
  git2dart: 0.5.6
  material_ui: ^1.1.0
  path_provider: 2.1.6
  sqlite3: 3.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-NotoSansSC.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
