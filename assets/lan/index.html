<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Dorm · 局域网工作台</title>
  <link rel="stylesheet" href="/dorm.css">
  <script defer src="/tools.js"></script>
  <script defer src="/dorm.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="logo" aria-hidden="true">D</span><strong>Dorm</strong></div>
      <nav aria-label="寝室模块">
        <button type="button" data-section="ledger"><span aria-hidden="true">▤</span>公共账本</button>
        <button type="button" data-section="chores"><span aria-hidden="true">▦</span>卫生排班</button>
        <button type="button" data-section="supplies"><span aria-hidden="true">◇</span>公共物资</button>
        <button type="button" data-section="matters"><span aria-hidden="true">☷</span>寝室事务</button>
        <button type="button" data-section="members"><span aria-hidden="true">☺</span>寝室成员</button>
        <button type="button" data-section="tools"><span aria-hidden="true">★</span>娱乐工具</button>
      </nav>
      <div class="sidebar-footer">
        <label class="viewer-box">
          <small>我的视角</small>
          <select id="viewer-select" aria-label="切换当前使用成员"></select>
        </label>
        <div class="theme-row">
          <select id="palette-select" aria-label="切换网页调色板">
            <option value="pine">松林绿</option>
            <option value="ocean">海盐蓝</option>
            <option value="amber">暖橘棕</option>
            <option value="plum">暮色紫</option>
            <option value="crimson">枫叶红</option>
            <option value="slate">石墨灰</option>
          </select>
          <button id="eink-toggle" type="button" class="ghost" aria-pressed="false">墨水屏</button>
        </div>
        <span id="server-status">正在连接</span>
      </div>
    </aside>
    <main class="workspace">
      <div class="workspace-header">
        <div><h1 id="section-title"></h1><p id="section-description"></p></div>
        <button id="refresh" type="button" class="ghost">刷新</button>
      </div>
      <div id="content" aria-live="polite"><p class="empty">正在读取数据…</p></div>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-header"><h2 id="dialog-title"></h2><button id="dialog-close" type="button" class="ghost" aria-label="关闭">关闭</button></div>
    <div id="dialog-body"></div>
  </dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
